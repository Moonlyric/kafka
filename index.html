<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海边的卡夫卡 · 交互叙事</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #141414;
    --text: #c8c0b8;
    --text-dim: #7a7268;
    --accent: #b8860b;
    --accent-glow: #d4a017;
    --crow: #cc3333;
    --dream: #4a6fa5;
    --cat: #6b8e5a;
    --danger: #8b2500;
    --transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  body {
    font-family: 'Noto Serif SC', 'SimSun', 'STSong', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    line-height: 1.9;
  }

  /* Ambient background particles */
  .ambient {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: floatUp linear infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.1; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(184,134,11,0.05); }
    50% { box-shadow: 0 0 40px rgba(184,134,11,0.12); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes crowFlicker {
    0%, 100% { color: var(--crow); }
    50% { color: #ff4444; text-shadow: 0 0 8px rgba(204,51,51,0.3); }
  }
  @keyframes textReveal {
    from { opacity: 0; filter: blur(4px); }
    to { opacity: 1; filter: blur(0); }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 720px;
    min-height: 100vh;
    padding: 40px 28px;
    display: flex;
    flex-direction: column;
    animation: pulseGlow 4s ease-in-out infinite;
  }

  /* Title bar */
  .title-bar {
    text-align: center;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(184,134,11,0.18);
    margin-bottom: 32px;
  }
  .title-bar h1 {
    font-size: 1.6rem;
    font-weight: 300;
    letter-spacing: 0.25em;
    color: var(--accent);
    text-shadow: 0 0 30px rgba(184,134,11,0.25);
  }
  .title-bar .subtitle {
    font-size: 0.78rem;
    color: var(--text-dim);
    letter-spacing: 0.3em;
    margin-top: 6px;
  }

  /* Chapter indicator */
  .chapter-tag {
    display: inline-block;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    border: 1px solid rgba(122,114,104,0.3);
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
  }

  /* Narrative text */
  .narrative {
    flex: 1;
    font-size: 1.05rem;
    line-height: 2.1;
    letter-spacing: 0.03em;
    color: var(--text);
    animation: textReveal 0.8s ease-out;
    transition: opacity var(--transition);
  }
  .narrative p { margin-bottom: 1.2em; text-indent: 2em; }
  .narrative p.no-indent { text-indent: 0; }

  /* Crow's voice — red, interruptive */
  .crow-voice {
    color: var(--crow);
    font-weight: 600;
    font-style: italic;
    border-left: 2px solid rgba(204,51,51,0.4);
    padding-left: 16px;
    margin: 20px 0;
    animation: crowFlicker 3s ease-in-out infinite;
    text-indent: 0 !important;
  }
  .crow-voice::before { content: "「"; }
  .crow-voice::after { content: "」"; }

  /* Dream sequence — blue-tinted */
  .dream-text {
    color: var(--dream);
    font-style: italic;
    opacity: 0.85;
    border-left: 2px solid rgba(74,111,165,0.35);
    padding-left: 16px;
    margin: 20px 0;
  }

  /* Cat dialogue — green-tinted */
  .cat-speak {
    color: var(--cat);
    font-style: italic;
    padding-left: 16px;
    border-left: 2px solid rgba(107,142,90,0.35);
    margin: 16px 0;
  }

  /* Choices */
  .choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 36px;
    animation: fadeInUp 0.7s ease-out;
  }
  .choice-btn {
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--text);
    background: var(--surface);
    border: 1px solid rgba(184,134,11,0.25);
    padding: 14px 22px;
    cursor: pointer;
    transition: all 0.35s ease;
    text-align: left;
    letter-spacing: 0.04em;
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }
  .choice-btn::before {
    content: '';
    position: absolute;
    left: 0; top: 0;
    width: 3px; height: 100%;
    background: var(--accent);
    transform: scaleY(0);
    transition: transform 0.35s ease;
  }
  .choice-btn:hover {
    background: #1a1a1a;
    border-color: rgba(184,134,11,0.55);
    color: #e8dcc8;
    padding-left: 28px;
  }
  .choice-btn:hover::before { transform: scaleY(1); }
  .choice-btn .choice-key {
    display: inline-block;
    color: var(--accent);
    font-size: 0.75rem;
    margin-right: 8px;
    opacity: 0.7;
  }

  /* Status bar */
  .status-bar {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid rgba(122,114,104,0.15);
    display: flex;
    gap: 20px;
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }
  .status-item { display: flex; align-items: center; gap: 6px; }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-dot.active { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
  .status-dot.dream { background: var(--dream); }
  .status-dot.crow { background: var(--crow); }

  /* Ending screen */
  .ending-screen {
    text-align: center;
    padding: 60px 20px;
    animation: fadeInUp 1.2s ease-out;
  }
  .ending-screen h2 {
    font-size: 1.5rem;
    font-weight: 300;
    letter-spacing: 0.3em;
    color: var(--accent);
    margin-bottom: 24px;
  }
  .ending-screen .ending-text {
    font-size: 1rem;
    line-height: 2.2;
    color: var(--text);
    margin-bottom: 32px;
  }
  .ending-screen .epitaph {
    font-size: 0.78rem;
    color: var(--text-dim);
    font-style: italic;
    letter-spacing: 0.15em;
  }

  /* Restart button */
  .restart-btn {
    font-family: inherit;
    font-size: 0.82rem;
    color: var(--accent);
    background: transparent;
    border: 1px solid rgba(184,134,11,0.35);
    padding: 10px 28px;
    cursor: pointer;
    letter-spacing: 0.2em;
    transition: all 0.3s ease;
    border-radius: 2px;
  }
  .restart-btn:hover {
    background: rgba(184,134,11,0.08);
    border-color: rgba(184,134,11,0.65);
  }

  /* Footer */
  .footer-note {
    text-align: center;
    font-size: 0.68rem;
    color: rgba(122,114,104,0.4);
    letter-spacing: 0.16em;
    padding-top: 28px;
    margin-top: 32px;
    border-top: 1px solid rgba(122,114,104,0.08);
  }

  /* Responsive */
  @media (max-width: 600px) {
    .container { padding: 24px 16px; }
    .narrative { font-size: 0.95rem; }
    .title-bar h1 { font-size: 1.3rem; }
  }

  /* Typewriter cursor for last paragraph sometimes */
  .cursor-blink::after {
    content: '▎';
    animation: blink 1s step-end infinite;
    color: var(--accent);
    opacity: 0.7;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: rgba(184,134,11,0.2); border-radius: 2px; }
</style>
</head>
<body>

<!-- Ambient particles -->
<div class="ambient" id="ambient"></div>

<!-- Main container -->
<div class="container" id="app">
  <div class="title-bar">
    <h1>海边的卡夫卡</h1>
    <div class="subtitle">カフカ※交互叙事</div>
  </div>
  <div id="chapterTag"></div>
  <div class="narrative" id="narrative"></div>
  <div class="choices" id="choices"></div>
  <div class="status-bar" id="statusBar"></div>
  <div class="footer-note">泠詩恋月与TA的Claude制作</div>
</div>

<script>
// ──────────────────────────────────
// Kafka on the Shore — Interactive Fiction Engine
// ──────────────────────────────────

const app = document.getElementById('app');
const narrativeEl = document.getElementById('narrative');
const choicesEl = document.getElementById('choices');
const chapterEl = document.getElementById('chapterTag');
const statusEl = document.getElementById('statusBar');

// Game state
const state = {
  currentNode: 'start',
  history: [],
  flags: {
    metSakura: false,
    metOshima: false,
    metSaeki: false,
    enteredLibrary: false,
    hadDream: false,
    shrineIncident: false,
    fatherDead: false,
    enteredForest: false,
    metSoldiers: false,
    ghostSaeki: false,
    shadowMerged: false,
    talkedToCat: false,
    heardMusic: false,
    choseViolence: false,
    chosePeace: false,
  },
  inventory: [],
  dreamCount: 0,
  shadowDepth: 0, // metaphorical "depth" tracker
};

// ── Narrative Database ──
const nodes = {

  // ═══════════════ PROLOGUE ═══════════════
  'start': {
    chapter: '序 · 叫乌鸦的少年',
    status: 'crow',
    text: `<p>那是你十五岁生日的前夜。行李早已收拾好——几件替换的衣服、牙刷、存了两年的一笔钱，还有一本翻旧了的《海边的卡夫卡》唱片封套——不是书，是一张你在旧货市场偶然发现的、早已绝版的唱片封套，上面印着一位年轻女子的侧影。</p>
    <p>窗外是东京深夜特有的沉默，那种连霓虹灯都疲惫了的、沉甸甸的沉默。你坐在自己房间的地板上，背靠着床沿，最后一次以「家」的名义审视这个空间。</p>
    <p class="crow-voice">你准备好了吗？从这里离开，就再也回不去了。你不再是「田村卡夫卡」，也不再是任何人的儿子。你将只是你自己——世界上最顽强的十五岁少年。</p>
    <p>那个被称作「叫乌鸦的少年」的声音在你的意识深处响起。他是你，又不是你。他是你体内那只随时准备振翅的乌鸦。</p>
    <p>父亲的话像一枚冰冷的钉子，楔在你的记忆里——<em>「你将亲手杀死你的父亲，并与你的母亲和姐姐交合。」</em></p>
    <p>你必须走。不是逃离预言，而是……走向它。</p>`,
    choices: [
      { text: '现在就出发，搭夜行巴士去四国', next: 'night_bus', key: 'A' },
      { text: '再等一等。等到黎明。', next: 'wait_dawn', key: 'B' },
      { text: '去父亲的工作室，最后看他一眼', next: 'see_father', key: 'C' },
    ]
  },

  'wait_dawn': {
    chapter: '序 · 等待',
    text: `<p>你决定等到天亮。夜色最浓的时刻，你坐在窗边，看着东京的天际线从墨黑一点点泛出鱼肚白。清晨的电车声远远传来，像某种温柔的警告。</p>
    <p>你推开家门时，走廊里还暗着。父亲的房间门紧闭，里面传出轻微的鼾声。你没有回头。</p>
    <p class="crow-voice">黎明出发的人，影子会比别人长一些。但那又如何？影子长，说明你已经站在了光里。</p>`,
    choices: [
      { text: '走向新宿车站，买一张去高松的夜行巴士票', next: 'night_bus', key: 'A' },
    ]
  },

  'see_father': {
    chapter: '序 · 雕塑家的工作室',
    text: `<p>你悄悄推开父亲工作室的门。石膏粉末在月光下像一片微型的雪原。那些未完成的雕塑立在暗处，扭曲的形体仿佛某种被诅咒的生物。</p>
    <p>墙上贴着一张便条，是父亲的字迹：<em>「形式即是囚笼。打碎形式，才能看见本质。」</em></p>
    <p>你不知道他是何时写下这句话的。也许是在雕刻的间隙，也许是在喝威士忌的深夜。无论如何，这都不再重要了。</p>
    <p class="crow-voice">别碰任何东西。他的世界有他的逻辑，但那不是你的。离开。马上。</p>`,
    choices: [
      { text: '轻轻关上门，背上背包，头也不回地离开', next: 'night_bus', key: 'A' },
    ]
  },

  // ═══════════════ BUS JOURNEY ═══════════════
  'night_bus': {
    chapter: '第一章 · 夜行巴士',
    status: 'neutral',
    text: `<p>夜行巴士在首都高速上平稳地滑行。车厢里只有寥寥几个乘客，大多蜷在座椅上睡着了。你选了最后一排靠窗的位置，额头贴着冰凉的玻璃，看着东京的灯火向后退去，越来越稀薄，最终被关东平原无边的黑暗吞没。</p>
    <p>你在想预言的事。俄狄浦斯在不知情中完成了神谕——弑父、娶母。但你是知情的。知情者能否避开命运？还是说，知情本身就是命运的一部分？</p>
    <p>巴士在服务区短暂停靠时，一个比你大几岁的女孩上了车。她染着茶色的短发，耳朵上挂着一排银环，径直坐到了你旁边。</p>
    <p>「嗨，一个人？」她嚼着口香糖，语气像是在和一只流浪猫打招呼。</p>`,
    choices: [
      { text: '「嗯。去高松。」——简短回应，但保持礼貌', next: 'meet_sakura', key: 'A' },
      { text: '「……」——假装睡着，不去回应', next: 'ignore_sakura', key: 'B' },
      { text: '「你也是一个人吗？」——反问她', next: 'ask_sakura', key: 'C' },
    ]
  },

  'meet_sakura': {
    chapter: '第一章 · 樱花',
    status: 'neutral',
    text: `<p>「高松？四国的高松？」她的眼睛亮了一下，「我老家就在那边。你去做什么？旅行？离家出走？」</p>
    <p>你没有回答最后一个问题。她似乎也不需要答案。「我叫樱花。」她说，「不是真名，但你就这么叫我好了。」</p>
    <p>樱花从包里掏出一罐温热的咖啡递给你。「离家出走的人需要咖啡因。别问我是怎么知道的。」</p>
    <p>你接过咖啡。罐身的温度透过掌心传来，那种微不足道的温暖竟让你有些恍惚。</p>
    <p class="crow-voice">小心。这个女孩身上的气息……和你记忆深处某个模糊的影子重叠了。但你不能告诉她。</p>`,
    choices: [
      { text: '「谢谢你，樱花。」——接过咖啡，和她聊到巴士到站', next: 'arrive_takamatsu_sakura', key: 'A' },
      { text: '「我不需要。」——拒绝好意，保持距离', next: 'arrive_takamatsu_alone', key: 'B' },
    ]
  },

  'ignore_sakura': {
    chapter: '第一章 · 沉默',
    text: `<p>你闭着眼睛，呼吸均匀。她等了几秒，自言自语般嘟囔了一句「现在的孩子真是……」便从包里拿出耳机戴上。</p>
    <p>从她耳机里漏出的音乐隐约是某首爵士乐——迈尔斯·戴维斯的小号，像一条半透明的河流在车厢里蜿蜒。你在心里跟着旋律走了一段，然后真的睡着了。</p>
    <p>梦里有一只黑猫蹲在路边，用翡翠色的眼睛看着你。它开口说话了，但当你醒来时，那句话已经沉入了记忆的深处。</p>`,
    choices: [
      { text: '巴士到达高松。你揉了揉眼睛，走下车', next: 'arrive_takamatsu_alone', key: 'A' },
    ]
  },

  'ask_sakura': {
    chapter: '第一章 · 问询',
    text: `<p>她挑了挑眉，似乎没想到你会反问。「我？我回老家看看家人。不过也可能只是借口——我就是想坐一趟长途巴士，什么也不想，就这么看着窗外。」</p>
    <p>「你知道吗？」她侧过头看着你，「你看起来像是在逃命。但你的眼睛又很平静。很奇怪。」</p>
    <p>「也许两者都是真的。」你说。</p>
    <p>她笑了。「有意思。我叫樱花。到了高松如果没地方去，可以找我。」她在一张便利店收据背面写了一个电话号码塞给你。</p>`,
    choices: [
      { text: '收下号码。和她有一搭没一搭地聊到天亮', next: 'arrive_takamatsu_sakura', key: 'A' },
    ]
  },

  // ═══════════════ ARRIVAL ═══════════════
  'arrive_takamatsu_sakura': {
    chapter: '第二章 · 高松',
    status: 'neutral',
    text: `<p>高松的清晨有一种濑户内海特有的湿润和清澈。樱花在车站出口向你挥了挥手。「保重啊，离家出走的少年。别死。」她笑着说，但那笑容底下藏着某种认真。</p>
    <p>然后她转身消失在晨光里，茶色短发在风中晃了晃，像一只掠过的鸟。</p>`,
    choices: [
      { text: '去找那家传说中的「甲村纪念图书馆」', next: 'find_library', key: 'A' },
      { text: '先在街上随便走走，感受一下这座陌生的城市', next: 'wander_city', key: 'B' },
    ],
    onEnter(state) {
      state.flags.metSakura = true;
      state.inventory.push('樱花的电话号码');
    }
  },

  'arrive_takamatsu_alone': {
    chapter: '第二章 · 高松',
    status: 'neutral',
    text: `<p>高松车站的清晨安静得近乎透明。你背着包站在站前广场上，看着远处濑户内海灰蓝色的水面，心想：就是这里了。</p>
    <p>没有人认识你。没有人知道你的名字。没有人知道那个预言。在这座城市里，你只是一张白纸。</p>`,
    choices: [
      { text: '去找那家传说中的「甲村纪念图书馆」', next: 'find_library', key: 'A' },
      { text: '先在街上随便走走', next: 'wander_city', key: 'B' },
    ]
  },

  'wander_city': {
    chapter: '第二章 · 闲逛',
    text: `<p>你在高松的街道上漫无目的地走着。经过了一家乌冬面馆、一座小小的神社、一家摆满旧书的二手店。一只三花猫蹲在神社的鸟居下面，眯着眼睛晒太阳。</p>
    <p>你蹲下来和猫对视了一会儿。猫打了个哈欠，露出粉红色的上颚。</p>
    <p class="cat-speak">你身上有远方的味道。乌鸦的味道。</p>
    <p>你眨了眨眼。猫刚才……说话了？不，那只是你自己的想象。猫只是打了个哈欠而已。</p>`,
    choices: [
      { text: '继续前往甲村纪念图书馆', next: 'find_library', key: 'A' },
    ],
    onEnter(state) { state.flags.talkedToCat = true; }
  },

  // ═══════════════ LIBRARY ═══════════════
  'find_library': {
    chapter: '第三章 · 甲村纪念图书馆',
    status: 'neutral',
    text: `<p>甲村纪念图书馆藏在一条安静的住宅区街道尽头。那是一栋老式的西洋建筑，外墙爬满常春藤，铁栅栏门半开半合，仿佛在说：来不来是你的自由。</p>
    <p>你推开厚重的橡木门。里面凉爽而幽暗，空气中弥漫着旧书、木质地板蜡和某种不知名花香混合的气味。大厅中央的柜台上方挂着一幅油画——一个年轻女子的肖像，她的眼神既温柔又遥远，像凝视着某个不在场的人。</p>
    <p>柜台后面传来一个清朗的声音：「欢迎光临。你是来看书的，还是来找人的？」</p>
    <p>说话的人是一个年轻的男性——或者说，看起来像男性的、穿着整洁白衬衫的年轻人。他的五官精致得过分，声音介于中性和男性之间。</p>`,

    status: 'neutral',
    text: `<p>你在图书馆里度过了整个白天。读了夏目漱石、读了《一千零一夜》、读了柏拉图的《会饮篇》。每一本书都像一扇通往别处的门。</p>

// ── Render engine ──
function renderNode(nodeId) {
  const node = nodes[nodeId];
  if (!node) { console.error('Missing node:', nodeId); return; }

  // Run onEnter hook
  if (node.onEnter) node.onEnter(state);

  // Update history
  state.history.push(nodeId);
  state.currentNode = nodeId;

  // Chapter tag
  if (node.chapter) {
    chapterEl.innerHTML = `<span class="chapter-tag">${node.chapter}</span>`;
  } else {
    chapterEl.innerHTML = '';
  }

  // Status bar
  const statusType = node.status || 'neutral';
  let statusHTML = '';
  if (state.flags.metSaeki) statusHTML += `<span class="status-item"><span class="status-dot active"></span>佐伯</span>`;
  if (state.flags.hadDream) statusHTML += `<span class="status-item"><span class="status-dot dream"></span>梦境</span>`;
  if (state.flags.fatherDead) statusHTML += `<span class="status-item"><span class="status-dot" style="background:var(--danger)"></span>弑父</span>`;
  if (state.flags.shadowMerged) statusHTML += `<span class="status-item"><span class="status-dot dream"></span>影融</span>`;
  if (state.flags.metSoldiers) statusHTML += `<span class="status-item"><span class="status-dot" style="background:#666"></span>守门人</span>`;
  statusEl.innerHTML = statusHTML;

  // Narrative text
  narrativeEl.innerHTML = node.text;

  // Choices or ending
  choicesEl.innerHTML = '';
  if (node.choices && node.choices.length > 0) {
    node.choices.forEach((choice, i) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = `<span class="choice-key">[${choice.key || i + 1}]</span> ${choice.text}`;
      btn.addEventListener('click', () => {
        narrativeEl.style.opacity = '0';
        choicesEl.style.opacity = '0';
        setTimeout(() => {
          if (choice.onChoose) choice.onChoose(state);
          renderNode(choice.next);
          narrativeEl.style.opacity = '1';
          choicesEl.style.opacity = '1';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 500);
      });
      choicesEl.appendChild(btn);
    });

    // Keyboard shortcuts
    const handleKey = (e) => {
      const key = e.key.toUpperCase();
      const choice = node.choices.find(c => c.key === key);
      if (choice) {
        document.removeEventListener('keydown', handleKey);
        narrativeEl.style.opacity = '0';
        choicesEl.style.opacity = '0';
        setTimeout(() => {
          if (choice.onChoose) choice.onChoose(state);
          renderNode(choice.next);
          narrativeEl.style.opacity = '1';
          choicesEl.style.opacity = '1';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 500);
      }
    };
    document.addEventListener('keydown', handleKey);
  } else if (node.ending) {
    // Show ending screen
    const endingDiv = document.createElement('div');
    endingDiv.className = 'ending-screen';
    endingDiv.innerHTML = `
      <h2>—— ${node.ending} ——</h2>
      <div class="ending-text">${node.text}</div>
      <div class="epitaph">${node.endingDesc || ''}</div>
      <br>
      <p style="font-size:0.72rem;color:var(--text-dim);margin-bottom:20px;">
        达成结局：<span style="color:var(--accent);">${node.ending}</span>
        &nbsp;·&nbsp; 历程节点：${state.history.length}
        &nbsp;·&nbsp; 梦境次数：${state.dreamCount}
      </p>
      <button class="restart-btn" onclick="restartGame()">重新开始 · 另一条路</button>
    `;
    choicesEl.appendChild(endingDiv);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function restartGame() {
  // Reset state
  state.currentNode = 'start';
  state.history = [];
  state.flags = {
    metSakura: false,
    metOshima: false,
    metSaeki: false,
    enteredLibrary: false,
    hadDream: false,
    shrineIncident: false,
    fatherDead: false,
    enteredForest: false,
    metSoldiers: false,
    ghostSaeki: false,
    shadowMerged: false,
    talkedToCat: false,
    heardMusic: false,
    choseViolence: false,
    chosePeace: false,
  };
  state.inventory = [];
  state.dreamCount = 0;
  state.shadowDepth = 0;

  narrativeEl.style.opacity = '1';
  choicesEl.style.opacity = '1';
  renderNode('start');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Ambient particle generator ──
function createAmbientParticles() {
  const ambient = document.getElementById('ambient');
  const count = 18;
  for (let i = 0; i < count; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    const size = Math.random() * 2.5 + 1;
    particle.style.width = size + 'px';
    particle.style.height = size + 'px';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.background =
      Math.random() > 0.6 ? 'rgba(184,134,11,0.6)' :
      Math.random() > 0.5 ? 'rgba(74,111,165,0.5)' :
      'rgba(204,51,51,0.4)';
    particle.style.animationDuration = (Math.random() * 18 + 10) + 's';
    particle.style.animationDelay = (Math.random() * 15) + 's';
    ambient.appendChild(particle);
  }
}

// ── Init ──
createAmbientParticles();
renderNode('start');
